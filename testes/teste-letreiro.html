<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste do letreiro</title><style>html,body{margin:0;background:#111;color:#eee;font:16px system-ui}section{min-height:100vh;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:5vh;padding:5vw;box-sizing:border-box}canvas{display:block;width:100%;position:relative;z-index:1}.letreiro{background:#090909;border:1px solid #40301c;border-radius:12px;padding:24px 3vw;box-shadow:0 0 45px #000}.particulas{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}.tools{position:relative;z-index:2}input{width:min(500px,90%)}h1{font-size:1rem;color:#aaa}button{padding:.7rem 1rem;margin:.3rem;background:#222;color:#eee;border:1px solid #76542e;border-radius:6px;cursor:pointer}</style></head><body><section><canvas class="particulas" id="particulas"></canvas><h1>Letreiro de LED ponto a ponto</h1><div class="letreiro"><canvas id="principal" role="img" aria-label="Letreiro com informações de Enzo Rezende"></canvas></div><div class="tools"><label for="queda">Soltar pontos</label><br><input id="queda" type="range" min="0" max="1" step="0.01" value="0"></div><div class="letreiro"><canvas id="contato" role="img" aria-label="Me chama"></canvas><div class="tools"><button type="button" data-t="LINKEDIN">LinkedIn</button><button type="button" data-t="E-MAIL">E-mail</button><button type="button" data-t="WHATSAPP">WhatsApp</button></div></div></section><script type="module" src="teste-letreiro.js"></script></body></html>
